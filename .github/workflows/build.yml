name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds with the default settings (no sdkconfig.local): placeholder
      # credentials that you change afterwards from the web page.
      - name: Build firmware (ESP-IDF v5.5.1, ESP32-C6)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c6
          command: >-
            idf.py build &&
            cd build &&
            esptool.py --chip esp32c6 merge_bin -o ../esp32c6-wifi-repeater-full.bin "@flash_args"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-wifi-repeater
          path: |
            esp32c6-wifi-repeater-full.bin
            build/wifi-repeater.bin

  release:
    # Publish the firmware on the Releases page when a version tag (v*) is pushed.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp32c6-wifi-repeater
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            esp32c6-wifi-repeater-full.bin
            build/wifi-repeater.bin

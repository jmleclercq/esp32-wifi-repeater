name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The project aims to stay **small and readable**. Features that add a lot of code or RAM use may be declined.
  - type: textarea
    id: usecase
    attributes:
      label: What are you trying to do?
      description: Describe the problem or use case before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
